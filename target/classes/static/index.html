<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 860px; margin: 40px auto; padding: 0 20px; color: #333; }
        h1 { color: #0366d6; }
        table { border-collapse: collapse; width: 100%; margin-top: 16px; }
        th { background-color: #0366d6; color: white; padding: 10px 12px; text-align: left; }
        td { padding: 8px 12px; border-bottom: 1px solid #ddd; }
        tr:hover td { background-color: #f0f6ff; }
    </style>
</head>
<body>
    <h1>Stock Tracker</h1>

    <table>
        <thead>
            <tr>
                <th>Symbol</th>
                <th>Company</th>
                <th>Sector</th>
                <th>Exchange</th>
            </tr>
        </thead>
        <tbody id="stocks-body">
            <tr><td colspan="4">Loading...</td></tr>
        </tbody>
    </table>

    <script>
        fetch('/api/stocks')
            .then(function(response) { return response.json(); })
            .then(function(stocks) {
                var tbody = document.getElementById('stocks-body');
                tbody.innerHTML = '';

                stocks.forEach(function(stock) {
                    var row = document.createElement('tr');
                    row.innerHTML = '<td>' + stock.symbol + '</td>' +
                        '<td>' + stock.companyName + '</td>' +
                        '<td>' + stock.sector + '</td>' +
                        '<td>' + stock.exchange + '</td>';
                    tbody.appendChild(row);
                });
            })
            .catch(function() {
                var tbody = document.getElementById('stocks-body');
                tbody.innerHTML = '<tr><td colspan="4">Failed to load stocks.</td></tr>';
            });
    </script>
</body>
</html>
